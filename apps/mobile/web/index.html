<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <base href="$FLUTTER_BASE_HREF" />
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Peça uma pizza demonstrativa da The Last Slice." />
    <meta name="theme-color" content="#101010" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="The Last Slice" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="icons/Icon-192.png" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <title>The Last Slice</title>
  </head>
  <body>
    <script>
      window.lastSliceTurnstileToken = function (siteKey) {
        return new Promise(function (resolve, reject) {
          function render() {
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#000a;display:grid;place-items:center';
            var panel = document.createElement('div');
            panel.style.cssText = 'padding:24px;background:#191919;border-radius:16px';
            overlay.appendChild(panel); document.body.appendChild(overlay);
            window.turnstile.render(panel, {sitekey:siteKey, callback:function(token){overlay.remove();resolve(token);}, 'error-callback':function(){overlay.remove();reject(new Error('challenge_unavailable'));}, 'expired-callback':function(){overlay.remove();reject(new Error('challenge_expired'));}});
          }
          if (window.turnstile) render();
          else if (document.querySelector('[data-turnstile-script]')) document.querySelector('[data-turnstile-script]').addEventListener('load', render, {once:true});
          else { var script=document.createElement('script'); script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit'; script.async=true; script.defer=true; script.dataset.turnstileScript='true'; script.onload=render; script.onerror=function(){reject(new Error('challenge_unavailable'));}; document.head.appendChild(script); }
        });
      };
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
